<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroFix Beeper Writer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              pager: ['"VT323"', 'monospace'],
              typewriter: ['"Courier Prime"', 'monospace'],
            },
            colors: {
              'desk-bg': '#f3f4f6',
              'ultra-violet': '#8338EC',
              'ultra-violet-dark': '#6020c0',
              'ultra-violet-light': '#9d5bf5',
              'cyber-yellow': '#FFD60A',
              'cyber-yellow-dark': '#e6c009',
              'paper-white': '#fffdf5',
            },
            boxShadow: {
              'plastic': 'inset 1px 1px 0px rgba(255, 255, 255, 0.3), inset -2px -2px 5px rgba(0, 0, 0, 0.3), 8px 8px 20px rgba(131, 56, 236, 0.25)',
              'screen-glow': 'inset 0 0 10px rgba(255, 214, 10, 0.5)',
            }
          }
        }
      }
    </script>
    <style>
      /* 保持透明背景 */
      body {
        background-color: transparent; 
        overflow: hidden;
      }
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
    <!-- 修复点 1: 这里加上 /src/ -->
    <link rel="stylesheet" href="/src/index.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 修复点 2: 这里加上 /src/ -->
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
